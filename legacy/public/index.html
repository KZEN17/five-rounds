      padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px))
    }

    .wrap {
      max-width: 560px;
      margin: 0 auto;
      padding-block: 18px 24px;
      display: flex;
      flex-direction: column;
      gap: 18px
    }

    h1,
    h2,
    h3 {
      font-family: var(--display);
      font-weight: 700;
      letter-spacing: .01em;
      margin: 0;
      text-wrap: balance;
      line-height: 1.05
    }

    h1 {
      font-size: 34px;
      text-transform: uppercase
    }

    h2 {
      font-size: 24px;
      text-transform: uppercase
    }

    h3 {
      font-size: 18px;
      text-transform: uppercase;
      letter-spacing: .03em
    }

    .eyebrow {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .12em;
      color: var(--muted);
      font-weight: 600
    }

    .muted {
      color: var(--muted)
    }

    .num {
      font-family: var(--display);
      font-variant-numeric: tabular-nums
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 12px;
      flex-wrap: wrap
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--sunk);
      color: var(--muted);
      font-weight: 500
    }

    .chip .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--muted)
    }

    .chip.ok .dot {
      background: var(--good)
    }

    /* week strip */
    .weeks {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 6px
    }

    .wk {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--fg);
      border-radius: 10px;
      padding: 8px 0 6px;
      font-family: var(--display);
      font-size: 20px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px
    }

    .wk small {
      font-family: var(--body);
      font-size: 9px;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--muted)
    }

    .wk.sel {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-ink)
    }

    .wk.sel small {
      color: var(--accent-ink);
      opacity: .8
    }

    .wk.done:not(.sel) {
      border-color: var(--good)
    }

    .wk.done small {
      color: var(--good)
    }

    .wk.sel.done small {
      color: var(--accent-ink)
    }

    .wk:focus-visible,
    button:focus-visible,
    input:focus-visible,
    textarea:focus-visible,
    select:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px
    }

    .belt {
      height: 10px;
      border-radius: 3px;
      background: var(--sunk);
      position: relative;
      overflow: hidden
    }

    .belt i {
      position: absolute;
      inset: 0 auto 0 0;
      background: var(--accent);
      border-radius: 3px
    }

    .belt b {
      position: absolute;
      right: 10%;
      top: 0;
      bottom: 0;
      width: 14%;
      background: var(--fg);
      opacity: .85
    }

    .weekhead {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 10px;
      flex-wrap: wrap
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px
    }

    /* readiness */
    .ready {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px
    }

    .flag {
      font-size: 13px;
      padding: 8px 10px;
      border-radius: 8px;
      background: var(--sunk)
    }

    .flag.warn {
      background: color-mix(in srgb, var(--warn) 16%, var(--surface));
      color: var(--fg)
    }

    .flag.ok {
      background: color-mix(in srgb, var(--good) 14%, var(--surface))
    }

    /* day list */
    .days {
      display: flex;
      flex-direction: column;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--surface);
      overflow: hidden
    }

    .day {
      border-top: 1px solid var(--line)
    }

    .day:first-child {
      border-top: 0
    }

    .dayrow {
      width: 100%;
      appearance: none;
      border: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      text-align: left;
      display: grid;
      grid-template-columns: 48px minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      padding: 12px 14px;
      cursor: pointer
    }

    .dayrow .d {
      font-family: var(--display);
      text-transform: uppercase;
      line-height: 1
    }

    .dayrow .d b {
      display: block;
      font-size: 20px
    }

    .dayrow .d span {
      font-size: 12px;
      color: var(--muted);
      font-family: var(--body)
    }

    .dayrow .what {
      min-width: 0
    }

    .dayrow .what strong {
      display: block;
      font-weight: 600
    }

    .dayrow .what span {
      font-size: 13px;
      color: var(--muted)
    }

    .tag {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .08em;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
      margin-right: 6px;
      vertical-align: 1px
    }

    .t-bjj {
      background: var(--accent-soft);
      color: var(--accent)
    }

    .t-bike,
    .t-walk {
      background: color-mix(in srgb, var(--good) 15%, transparent);
      color: var(--good)
    }

    .t-hard {
      background: color-mix(in srgb, var(--work) 15%, transparent);
      color: var(--work)
    }

    .t-open {
      background: var(--sunk);
      color: var(--muted)
    }

    .check {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2px solid var(--line);
      display: grid;
      place-items: center;
      font-size: 14px;
      color: transparent
    }

    .check {
      cursor: pointer;
      min-width: 30px;
      min-height: 30px
    }

    .check.on {
      background: var(--good);
      border-color: var(--good);
      color: #fff
    }

    .day.today .dayrow {
      box-shadow: inset 3px 0 0 var(--accent)
    }

    .log {
      padding: 0 14px 16px 74px;
      display: flex;
      flex-direction: column;
      gap: 12px
    }

    .fields {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
      gap: 8px
    }

    label.f {
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .06em;
      font-weight: 600;
      min-width: 0
    }

    input,
    textarea,
    select {
      font: inherit;
      font-size: 16px;
      color: var(--fg);
      background: var(--sunk);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 10px;
      width: 100%;
      min-width: 0
    }

    textarea {
      min-height: 64px;
      resize: vertical
    }

    .toggle {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 500;
      cursor: pointer
    }

    .toggle input {
      width: 20px;
      height: 20px;
      accent-color: var(--good)
    }

    .rounds {
      overflow-x: auto
    }

    .rounds table {
      border-collapse: collapse;
      width: 100%;
      min-width: 300px
    }

    .rounds th {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--muted);
      text-align: left;
      padding: 0 6px 4px 0;
      font-weight: 600
    }

    .rounds td {
      padding: 3px 6px 3px 0
    }

    .rounds td:first-child {
      font-family: var(--display);
      font-size: 18px;
      width: 36px
    }

    .rounds input {
      padding: 6px 8px
    }

    .derived {
      font-size: 13px;
      display: flex;
      gap: 14px;
      flex-wrap: wrap
    }

    .derived b {
      font-family: var(--display);
      font-size: 18px
    }

    .seg {
      display: flex;
      background: var(--sunk);
      border-radius: 10px;
      padding: 3px;
      gap: 3px
    }

    .seg button {
      flex: 1;
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      padding: 7px 6px;
      border-radius: 8px;
      cursor: pointer
    }

    .seg button.on {
      background: var(--surface);
      color: var(--fg);
      box-shadow: 0 1px 2px rgba(0, 0, 0, .12)
    }

    .hint {
      font-size: 13px;
      color: var(--muted)
    }

    .btn {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--fg);
      font: inherit;
      font-weight: 600;
      padding: 10px 14px;
      border-radius: 10px;
      cursor: pointer
    }

    .btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-ink)
    }

    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center
    }

    .item {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-top: 12px;
      border-top: 1px dashed var(--line)
    }

    .item:first-child {
      border-top: 0;
      padding-top: 0
    }

    .item.add {
      background: var(--sunk);
      border: 0;
      border-radius: 10px;
      padding: 12px
    }

    .itemhead strong {
      font-weight: 600
    }

    .dayrow .what {
      display: flex;
      flex-direction: column;
      gap: 2px
    }

    .dayrow .what strong+span {
      margin-bottom: 4px
    }

    .dayrow .what span:last-child {
      margin-bottom: 0
    }

    .when {
      font-style: normal;
      font-size: 12px;
      color: var(--accent);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .05em
    }

    .tick {
      color: var(--good)
    }

    .edited {
      display: block;
      margin-top: 4px;
      font-size: 9px !important;
      letter-spacing: .08em;
      color: var(--accent) !important;
      font-weight: 600
    }

    .check.part {
      border-color: var(--good);
      color: var(--good);
      font-size: 10px;
      font-weight: 700;
      font-family: var(--body)
    }

    .btn.small {
      padding: 6px 10px;
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
      align-self: flex-start
    }

    select {
      appearance: auto
    }

    /* fuel */
    .fhead {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 12px;
      flex-wrap: wrap
    }

    .big {
      font-size: 58px;
      font-weight: 700;
      line-height: .9
    }

    .big small {
      font-size: 18px;
      color: var(--muted);
      font-weight: 500
    }

    .big.over {
      color: var(--bad)
    }

    .ftarget {
      text-align: right
    }

    .fbar {
      height: 8px;
      border-radius: 4px;
      background: var(--sunk);
      overflow: hidden
    }

    .fbar i {
      display: block;
      height: 100%;
      background: var(--accent);
      border-radius: 4px
    }

    .fbar.over i {
      background: var(--bad)
    }

    .fbar.p i {
      background: var(--work)
    }

    .fbar.c i {
      background: var(--good)
    }

    .fbar.f i {
      background: var(--warn)
    }

    .macros {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px
    }

    .mlabel {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 4px
    }

    .mlabel b {
      display: block;
      color: var(--fg);
      font-family: var(--display);
      font-size: 17px;
      font-variant-numeric: tabular-nums
    }

    .calc {
      display: flex;
      flex-direction: column;
      font-size: 14px
    }

    .calc div {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 5px 0;
      border-bottom: 1px solid var(--line)
    }

    .calc span {
      min-width: 0
    }

    .calc b {
      font-family: var(--display);
      font-size: 17px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap
    }

    .calc .sum {
      border-bottom: 2px solid var(--fg)
    }

    .food {
      grid-template-columns: repeat(4, minmax(0, 1fr))
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px
    }

    .chipbtn {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--sunk);
      color: var(--fg);
      font: inherit;
      font-size: 13px;
      padding: 6px 10px;
      border-radius: 999px;
      cursor: pointer
    }

    .chipbtn span {
      color: var(--muted);
      font-variant-numeric: tabular-nums
    }

    .tbl tr.tot td {
      font-weight: 600;
      border-bottom: 0
    }

    details.panel summary {
      cursor: pointer;
      list-style-position: inside
    }

    .pickrow {
      display: flex;
      gap: 8px;
      align-items: flex-start
    }

    .picks {
      display: flex;
      flex-direction: column;
      gap: 4px
    }

    .picks:empty {
      display: none
    }

    .pick {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--fg);
      font: inherit;
      text-align: left;
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap
    }

    .pick span:last-child {
      font-size: 12px;
      color: var(--muted);
      font-variant-numeric: tabular-nums
    }

    .pick em.cat {
      color: var(--muted)
    }

    .pick em {
      font-style: normal;
      font-size: 10px;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 600
    }

    table.ing input.gin {
      width: 62px;
      padding: 5px 6px;
      font-size: 15px
    }

    table.ing td {
      vertical-align: middle
    }

    .ate {
      font-size: 14px;
      padding: 10px 12px;
      border-radius: 8px;
      background: var(--accent-soft)
    }

    .ate b {
      font-family: var(--display);
      font-size: 18px
    }

    .chipwrap {
      display: inline-flex;
      align-items: center
    }

    .chipwrap .chipbtn {
      border-radius: 999px 0 0 999px
    }

    .chipx {
      appearance: none;
      border: 1px solid var(--line);
      border-left: 0;
      background: var(--sunk);
      color: var(--muted);
      font: inherit;
      font-size: 12px;
      padding: 6px 9px;
      border-radius: 0 999px 999px 0;
      cursor: pointer
    }

    .newing summary {
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      color: var(--accent)
    }

    /* timer */
    .clock {
      border-radius: 18px;
      padding: 22px 16px;
      text-align: center;
      background: var(--sunk);
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: background .3s
    }

    .clock.work {
      background: color-mix(in srgb, var(--work) 18%, var(--surface))
    }

    .clock.rest {
      background: color-mix(in srgb, var(--rest) 18%, var(--surface))
    }

    .clock .phase {
      font-family: var(--display);
      font-size: 22px;
      text-transform: uppercase;
      letter-spacing: .08em;
      font-weight: 600
    }

    .clock .time {
      font-family: var(--display);
      font-weight: 700;
      font-size: min(30vw, 132px);
      line-height: .95;
      font-variant-numeric: tabular-nums
    }

    .pips {
      display: flex;
      justify-content: center;
      gap: 6px
    }

    .pips i {
      width: 28px;
      height: 6px;
      border-radius: 3px;
      background: var(--line)
    }

    .pips i.done {
      background: var(--accent)
    }

    .pips i.cur {
      background: var(--work)
    }

    /* charts */
    .chart svg {
      width: 100%;
      height: auto;
      display: block
    }

    .chart .axis {
      stroke: var(--line)
    }

    .chart .lbl {
      fill: var(--muted);
      font-size: 10px;
      font-family: var(--body)
    }

    .chart .ln {
      fill: none;
      stroke: var(--accent);
      stroke-width: 2.5
    }

    .chart .pt {
      fill: var(--accent)
    }

    .chart .last {
      fill: var(--accent);
      stroke: var(--surface);
      stroke-width: 2
    }

    .chart .area {
      fill: var(--accent);
      opacity: .1
    }

    .empty {
      font-size: 13px;
      color: var(--muted);
      padding: 16px;
      border: 1px dashed var(--line);
      border-radius: 10px;
      text-align: center
    }

    .tbl {
      overflow-x: auto
    }

    .tbl table {
      border-collapse: collapse;
      width: 100%;
      font-size: 14px
    }

    .tbl th,
    .tbl td {
      text-align: left;
      padding: 6px 8px 6px 0;
      border-bottom: 1px solid var(--line)
    }

    .tbl th {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--muted)
    }

    .tbl td {
      font-variant-numeric: tabular-nums
    }

    /* watch guide */
    .steps {
      display: flex;
      flex-direction: column;
      gap: 14px;
      counter-reset: s;
      margin: 0;
      padding: 0;
      list-style: none
    }

    .steps li {
      display: grid;
      grid-template-columns: 30px minmax(0, 1fr);
      gap: 10px
    }

    .steps li::before {
      counter-increment: s;
      content: counter(s);
      font-family: var(--display);
      font-size: 22px;
      font-weight: 700;
      color: var(--accent);
      line-height: 1
    }

    .steps p {
      margin: 4px 0 0;
      font-size: 14px
    }

    .path {
      font-size: 13px;
      background: var(--sunk);
      border-radius: 6px;
      padding: 2px 6px;
      white-space: normal
    }

    /* tab bar */
    .tabs {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--surface);
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: center;
      padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
      z-index: 5
    }

    .tabs nav {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
      width: 100%;
      max-width: 560px
    }

    .tabs a {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 6px 0;
      border-radius: 10px;
      color: var(--muted);
      text-decoration: none;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .04em;
      text-transform: uppercase
    }

    .tabs a svg {
      width: 22px;
      height: 22px
    }

    .tabs a.on {
      color: var(--accent);
      background: var(--accent-soft)
    }

    @media (max-width:420px) {
      .log {
        padding-left: 14px
      }

      .ready {
        grid-template-columns: repeat(3, minmax(0, 1fr))
      }
    }

    @media (prefers-reduced-motion:reduce) {
      * {
        transition: none !important
      }
    }

    /* page reset (was provided by the Claude viewer) */
    :root {
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    html {
      -webkit-text-size-adjust: 100%
    }

    body {
      margin: 0
    }

    img {
      max-width: 100%
    }

    [hidden] {
      display: none !important
    }

    textarea#bk-text {
      min-height: 80px;
      font-size: 13px
    }
  </style>
</head>

<body>
  <div class="wrap" id="app">
    <div class="top">
      <div>
        <div class="eyebrow">8-week conditioning · 5 × 5:00 / 1:00</div>
        <h1>Five Rounds Engine</h1>
      </div>
      <span class="chip" id="sync"><span class="dot"></span><span>Loading</span></span>
    </div>
    <div id="view">
      <div class="empty">Loading your plan…</div>
    </div>
  </div>

  <div class="tabs">
    <nav>
      <a href="#week" data-tab="week"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="5" width="18" height="16" rx="2" />
          <path d="M3 10h18M8 3v4M16 3v4" />
        </svg>Week</a>
      <a href="#timer" data-tab="timer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="13" r="8" />
          <path d="M12 9v4l2 2M9 2h6" />
        </svg>Timer</a>
      <a href="#fuel" data-tab="fuel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 3c3 4 6 7 6 11a6 6 0 0 1-12 0c0-4 3-7 6-11z" />
          <path d="M12 18a3 3 0 0 1-3-3" />
        </svg>Fuel</a>
      <a href="#progress" data-tab="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2">
          <path d="M3 20h18M6 16l4-5 3 3 5-7" />
        </svg>Progress</a>
      <a href="#watch" data-tab="watch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="6" y="6" width="12" height="12" rx="3" />
          <path d="M9 6l1-3h4l1 3M9 18l1 3h4l1-3" />
        </svg>Watch</a>
    </nav>
  </div>

  <script>
    (function () {
      /* ---------- programme ---------- */
      const BIKE = [[30, 30], [35, 30], [35, 35], [40, 35], [40, 40], [45, 40], [45, 45], [30, 30]];
      const ROW = [3, 3, 4, 4, 5, 5, 5, 3];
      const SIM = [3, 3, 4, 4, 4, 5, 5, 3];
      const DOW = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
      const TYPES = {
        bjj: { tag: "BJJ", cls: "t-bjj", name: "Hard BJJ", sub: "Log minutes, RPE and hard rounds", mat: 1 },
        open: { tag: "Open", cls: "t-open", name: "Open mat", sub: "Normal rolling, no extra conditioning", mat: 1 },
        bike: { tag: "Bike", cls: "t-bike", name: "Bike", sub: "RPE 3–4, conversational", hr: 1 },
        row: { tag: "Row", cls: "t-hard", name: "Rowing", sub: "1:00 rest · RPE 7–8 · even output", hr: 1 },
        sim: { tag: "Sim", cls: "t-hard", name: "Comp sim", sub: "1:00 rest · different partners", mat: 1 },
        atg: { tag: "ATG", cls: "t-walk", name: "ATG", sub: "Mobility and strength" },
        walk: { tag: "Recover", cls: "t-walk", name: "Recovery walk", sub: "Easy. Check sleep and resting HR" },
        strength: { tag: "Gym", cls: "t-open", name: "Strength", sub: "Weights session", hr: 1 },
        other: { tag: "Other", cls: "t-open", name: "Custom", sub: "Your own session", hr: 1 }
      };
      const ORDER = ["bjj", "open", "sim", "row", "bike", "atg", "walk", "strength", "other"];
      const WHEN = ["", "Morning", "Midday", "Evening"];
      function defaults(type, w, i) {
        const it = { type };
        if (type === "bike") it.mins = BIKE[w - 1][i === 3 ? 1 : 0];
        if (type === "row") it.rounds = ROW[w - 1];
        if (type === "sim") it.rounds = SIM[w - 1];
        return it;
      }
      function planItems(w, i) {
        const P = (type, extra) => Object.assign({ id: "p" }, defaults(type, w, i), extra || {});
        switch (i) {
          case 0: case 2: case 4: return [P("bjj")];
          case 1: case 3: return [{ id: "atg", type: "atg" }, P("bike")];
          case 5: return [P(satOf(w))];
          default: return [{ id: "atg", type: "atg" }, P("walk")];
        }
      }
      const dk = (w, i) => "w" + w + "d" + i;
      function items(w, i) { return S.custom[dk(w, i)] || planItems(w, i) }
      function editItems(w, i) { const k = dk(w, i); if (!S.custom[k]) S.custom[k] = JSON.parse(JSON.stringify(planItems(w, i))); return S.custom[k] }
      const logKey = (w, i, it) => it.id === "p" ? dk(w, i) : dk(w, i) + "-" + it.id;
      function titleOf(it) {
        switch (it.type) {
          case "bike": return "Bike " + (it.mins || "?") + " min";
          case "row": return "Rowing " + (it.rounds || "?") + " × 5:00";
          case "sim": return "Comp sim " + (it.rounds || "?") + " × 5:00";
          case "other": return it.title || "Custom session";
          default: return TYPES[it.type].name;
        }
      }
      const hasRounds = it => it.type === "row" || it.type === "sim";

      const pad = n => String(n).padStart(2, "0");
      const iso = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
      const parse = s => { const [a, b, c] = s.split("-").map(Number); return new Date(a, b - 1, c) };
      const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x };
      const fmt = d => d.toLocaleDateString("en-GB", { day: "numeric", month: "short" });
      const mondayOf = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); const k = (x.getDay() + 6) % 7; return addDays(x, -k) };
      const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
      const num = v => { const n = parseFloat(String(v ?? "").replace(",", ".")); return isFinite(n) ? n : null };
      const mean = a => { const b = a.filter(x => x != null); return b.length ? b.reduce((s, x) => s + x, 0) / b.length : null };

      /* ---------- state ---------- */
      function freshFuel() { return { sex: "m", age: "", height: "", weight: "", base: 1.2, rate: 0.25, protein: 2, protect: true, weights: {}, food: {}, ingr: {}, meals: {}, draft: { name: "", items: [], serv: 1, eat: 1 } } }
      function fresh() { return { start: iso(mondayOf(new Date())), sat: {}, logs: {}, weeks: {}, ready: {}, bikeCap: "", custom: {}, fuel: freshFuel() } }
      let S = fresh();
      function satOf(w) { return S.sat[w] || (w % 2 ? "sim" : "row") }
      function weekOfDate(d) { return Math.floor((mondayOf(d) - parse(S.start)) / 864e5 / 7) + 1 }
      let selWeek = Math.min(8, Math.max(1, weekOfDate(new Date())));
      let openKey = null;
      let itemByKey = {};

      /* ---------- persistence: this device + /api/state on Vercel ---------- */
      let saving = false, dirty = false, saveT = null, remote = "unknown";
      function setSync(text, ok) { const c = document.getElementById("sync"); c.className = "chip" + (ok ? " ok" : ""); c.lastChild.textContent = text }
      function hydrate(o) { S = Object.assign(fresh(), o); S.custom = S.custom || {}; S.fuel = Object.assign(freshFuel(), S.fuel || {}); S.fuel.weights = S.fuel.weights || {}; S.fuel.food = S.fuel.food || {}; S.fuel.ingr = S.fuel.ingr || {}; S.fuel.meals = S.fuel.meals || {}; S.fuel.draft = S.fuel.draft || emptyDraft() }
      function loadLocal() { try { const r = localStorage.getItem("fre-state"); if (r) hydrate(JSON.parse(r)) } catch (e) { } }
      function saveLocal() { try { localStorage.setItem("fre-state", JSON.stringify(S)) } catch (e) { } }
      async function api(method, body) {
        const r = await fetch("/api/state", { method, headers: { "content-type": "application/json" }, credentials: "same-origin", body: body ? JSON.stringify(body) : undefined, cache: "no-store" });
        if (r.status === 401) throw { code: "auth" };
        if (r.status === 503) throw { code: "off" };
        if (!r.ok) throw { code: "net" };
        return r.json();
      }
      function handleErr(e) {
        if (e && e.code === "auth") { remote = "locked"; setSync("Signed out", false); if (navigator.onLine) location.replace("/login.html") }
        else if (e && e.code === "off") { remote = "off"; setSync("Saved on this device", false) }
        else setSync("Offline · saved on device", false);
      }
      function scheduleSave() { S._t = Date.now(); saveLocal(); dirty = true; clearTimeout(saveT); saveT = setTimeout(flush, 700) }
      async function flush() {
        if (remote !== "on" || !dirty || saving) return;
        saving = true; dirty = false;
        try { await api("PUT", { state: S }); setSync("Synced", true) }
        catch (e) { dirty = true; handleErr(e) }
        saving = false; if (dirty && remote === "on") setTimeout(flush, 3000);
      }
      async function pull() {
        try {
          const j = await api("GET"); remote = "on";
          if (j.state && (j.state._t || 0) > (S._t || 0)) { hydrate(j.state); saveLocal(); safeRender() }
          else if (!j.state || (S._t || 0) > (j.state._t || 0)) { dirty = true; await flush() }
          setSync("Synced", true);
        } catch (e) { handleErr(e) }
      }
      async function initStore() {
        loadLocal(); setSync("Connecting", false); render();
        await pull();
        document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && remote === "on") pull() });
        setInterval(() => { if (document.visibilityState === "visible" && remote === "on" && !dirty) pull() }, 60000);
        if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => { });
      }
      function safeRender() { const a = document.activeElement; if (a && a.closest && a.closest("#view") && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) { a.addEventListener("blur", () => render(), { once: true }); return } render() }

      /* ---------- readiness ---------- */
      function readiness(dateIso) {
        const r = S.ready[dateIso] || {};
        const prev = Object.keys(S.ready).filter(k => k < dateIso).sort().slice(-7).map(k => S.ready[k]);
        const bR = mean(prev.map(p => num(p.rhr))), bH = mean(prev.map(p => num(p.hrv)));
        const flags = [];
        const sl = num(r.sleep), rh = num(r.rhr), hv = num(r.hrv);
        if (sl != null && sl < 7) flags.push("under 7 h sleep");
        if (rh != null && bR != null && rh >= bR + 5) flags.push("resting HR " + Math.round(rh - bR) + " bpm above your 7-day average");
        if (hv != null && bH != null && hv <= bH * 0.85) flags.push("HRV " + Math.round((1 - hv / bH) * 100) + "% below your 7-day average");
        return { r, flags, has: sl != null || rh != null || hv != null, base: prev.length };
      }

      /* ---------- week view ---------- */
      function weekCount(w) { let d = 0, t = 0; for (let i = 0; i < 7; i++)for (const it of items(w, i)) { t++; if ((S.logs[logKey(w, i, it)] || {}).done) d++ } return { d, t } }
      function typeOptions(sel) { return ORDER.map(t => `<option value="${t}"${t === sel ? " selected" : ""}>${TYPES[t].name}</option>`).join("") }
      function renderWeek() {
        itemByKey = {};
        const start = parse(S.start), w = selWeek, ws = addDays(start, (w - 1) * 7), todayIso = iso(new Date());
        const done = Object.values(S.weeks).filter(Boolean).length;
        const wc = weekCount(w);
        let h = `<div class="weeks" role="tablist" aria-label="Programme week">`;
        for (let k = 1; k <= 8; k++) { const c = weekCount(k); h += `<button class="wk${k === w ? " sel" : ""}${S.weeks[k] ? " done" : ""}" data-week="${k}" aria-pressed="${k === w}">${k}<small>${S.weeks[k] ? "Done" : c.d ? c.d + "/" + c.t : k === 8 ? "Taper" : c.t + " sess"}</small></button>` }
        h += `</div>
  <div class="panel" style="gap:8px">
    <div class="weekhead"><h2>Week ${w}</h2><span class="muted">${fmt(ws)} – ${fmt(addDays(ws, 6))}</span></div>
    <div class="belt" aria-label="${done} of 8 weeks completed"><i style="width:${done / 8 * 100}%"></i><b></b></div>
    <div class="row" style="justify-content:space-between"><span class="hint">${done}/8 weeks complete · ${wc.d}/${wc.t} sessions this week</span>
    <label class="toggle" style="font-size:14px"><input type="checkbox" id="wkdone" ${S.weeks[w] ? "checked" : ""}> Week ${w} completed</label></div>
  </div>`;
        const rd = readiness(todayIso);
        h += `<div class="panel"><div class="weekhead"><h3>Today's readiness</h3><span class="hint">From the Health app</span></div>
  <div class="ready">
    <label class="f">Sleep h<input id="rd-sleep" inputmode="decimal" data-ready="sleep" value="${esc(rd.r.sleep)}" placeholder="7.5"></label>
    <label class="f">Resting HR<input id="rd-rhr" inputmode="numeric" data-ready="rhr" value="${esc(rd.r.rhr)}" placeholder="bpm"></label>
    <label class="f">HRV<input id="rd-hrv" inputmode="numeric" data-ready="hrv" value="${esc(rd.r.hrv)}" placeholder="ms"></label>
  </div><div id="rdflag">${flagHtml(rd)}</div></div>`;
        const sat = satOf(w);
        h += `<div class="panel" style="gap:8px"><div class="weekhead"><h3>Saturday's hard session</h3><span class="hint">Alternate weekly</span></div>
  <div class="seg" role="group" aria-label="Saturday session">
    <button data-sat="sim" class="${sat === "sim" ? "on" : ""}">Comp sim · ${SIM[w - 1]} rds</button>
    <button data-sat="row" class="${sat === "row" ? "on" : ""}">Row · ${ROW[w - 1]} rds</button>
    <button data-sat="open" class="${sat === "open" ? "on" : ""}">Open mat only</button>
  </div><div class="hint">Pick open mat only if the week's BJJ already beat you up. Tap any day to swap or add sessions.</div></div>`;
        h += `<div class="days">`;
        for (let i = 0; i < 7; i++) {
          const d = addDays(ws, i), key = dk(w, i), list = items(w, i);
          const isToday = iso(d) === todayIso, open = openKey === key, changed = !!S.custom[key];
          const nd = list.filter(it => (S.logs[logKey(w, i, it)] || {}).done).length;
          const all = list.length && nd === list.length;
          let lines = list.length ? list.map(it => {
            const L = S.logs[logKey(w, i, it)] || {};
            return `<strong><span class="tag ${TYPES[it.type].cls}">${TYPES[it.type].tag}</span>${it.when ? `<em class="when">${esc(it.when)}</em> ` : ""}${esc(titleOf(it))}${L.done ? ' <span class="tick">✓</span>' : ""}</strong><span>${summary(it, L) || esc(TYPES[it.type].sub)}</span>`
          }).join("")
            : `<strong><span class="tag t-open">Rest</span>Rest day</strong><span>Nothing planned</span>`;
          h += `<div class="day${isToday ? " today" : ""}">
      <button class="dayrow" data-open="${key}" aria-expanded="${open}">
        <span class="d"><b>${DOW[i]}</b><span>${fmt(d)}</span>${changed ? '<span class="edited">Edited</span>' : ""}</span>
        <span class="what">${lines}</span>
        <span class="check${all ? " on" : ""}${nd && !all ? " part" : ""}" data-doneday="${w}|${i}" role="checkbox" aria-checked="${all ? "true" : nd ? "mixed" : "false"}" title="${all ? "Mark not done" : "Mark all done"}" aria-label="${nd} of ${list.length} done. Tap to ${all ? "clear" : "mark all done"}">${nd && !all ? nd + "/" + list.length : "✓"}</span>
      </button>${open ? dayEditor(w, i, list, changed) : ""}</div>`;
        }
        h += `</div>`;
        return h;
      }
      function dayEditor(w, i, list, changed) {
        let h = `<div class="log">`;
        list.forEach(it => {
          const key = logKey(w, i, it), L = S.logs[key] || {};
          itemByKey[key] = it;
          const ref = `${w}|${i}|${it.id}`;
          h += `<div class="item">
      <div class="itemhead"><strong><span class="tag ${TYPES[it.type].cls}">${TYPES[it.type].tag}</span>${esc(titleOf(it))}</strong></div>
      <div class="fields">
        <label class="f">Session<select id="sw-${key}" data-swap="${ref}">${typeOptions(it.type)}</select></label>
        <label class="f">When<select id="wh-${key}" data-when="${ref}">${WHEN.map(x => `<option value="${x}"${(it.when || "") === x ? " selected" : ""}>${x || "Any time"}</option>`).join("")}</select></label>
        ${it.type === "bike" ? `<label class="f">Minutes<input id="pm-${key}" inputmode="numeric" data-param="${ref}" data-pf="mins" value="${esc(it.mins)}"></label>` : ""}
        ${hasRounds(it) ? `<label class="f">Rounds<input id="pr-${key}" inputmode="numeric" data-param="${ref}" data-pf="rounds" value="${esc(it.rounds)}"></label>` : ""}
        ${it.type === "other" ? `<label class="f" style="grid-column:1/-1">Name<input id="pt-${key}" data-param="${ref}" data-pf="title" value="${esc(it.title)}" placeholder="e.g. Wrestling class"></label>` : ""}
      </div>
      ${logForm(key, it, L)}
      <div class="row"><button class="btn small" data-remove="${ref}">Remove this session</button></div>
    </div>`;
        });
        h += `<div class="item add"><div class="itemhead"><strong>Add a session</strong></div>
    <div class="row"><select id="add-${dk(w, i)}" aria-label="Session type" style="flex:1;min-width:0">${typeOptions("bjj")}</select>
    <select id="addw-${dk(w, i)}" aria-label="When" style="flex:1;min-width:0">${WHEN.map(x => `<option value="${x}"${x === "Evening" ? " selected" : ""}>${x || "Any time"}</option>`).join("")}</select>
    <button class="btn primary" data-add="${w}|${i}">Add</button></div>
    ${changed ? `<button class="btn small" data-resetday="${w}|${i}">Reset day to the plan</button>` : ""}
  </div></div>`;
        return h;
      }
      function flagHtml(rd) {
        if (!rd.has) return `<div class="hint">Morning numbers: sleep from Sleep, resting HR and HRV from Health → Heart.</div>`;
        if (rd.flags.length) return `<div class="flag warn"><strong>Ease off today.</strong> ${rd.flags.join("; ")}. Keep the bike easy and skip or shorten hard conditioning.</div>`;
        return `<div class="flag ok">Green light${rd.base < 3 ? " (baseline builds after 3 days of entries)" : ""}. Train as planned.</div>`;
      }
      function summary(it, L) {
        if (!L.done && !L.avg && !L.rpe && !(L.rounds || []).some(r => r && (r.end || r.m || r.rpe))) return "";
        const bits = [];
        if (L.dur) bits.push(L.dur + " min");
        if (L.avg && !TYPES[it.type].mat) bits.push("avg " + L.avg + " bpm");
        if (L.rpe) bits.push("RPE " + L.rpe);
        if (L.rolls) bits.push(L.rolls + " hard rounds");
        if (it.type === "sim") { const d = roundStats(L.rounds || [], num(it.rounds) || 0); if (d.rFirst != null && d.rLast != null) bits.push("round RPE " + d.rFirst + " → " + d.rLast) }
        else if (hasRounds(it)) { const d = roundStats(L.rounds || [], num(it.rounds) || 0); if (d.rec != null) bits.push("−" + Math.round(d.rec) + " bpm/rest"); if (d.drop != null) bits.push((d.drop > 0 ? "−" : "+") + Math.abs(d.drop).toFixed(0) + "% output") }
        return bits.join(" · ");
      }
      function roundStats(r, n) {
        const rr = r.slice(0, n);
        const rec = mean(rr.map(x => x && num(x.end) != null && num(x.rec) != null ? num(x.end) - num(x.rec) : null));
        const ms = rr.map(x => x ? num(x.m) : null).filter(x => x != null);
        const drop = ms.length >= 2 ? (ms[0] - ms[ms.length - 1]) / ms[0] * 100 : null;
        const rp = rr.map(x => x ? num(x.rpe) : null);
        const rFirst = rp[0] ?? null, rLast = rp.length === n && rp[n - 1] != null ? rp[n - 1] : null;
        return { rec, drop, avgM: mean(ms), rFirst, rLast, rMean: mean(rp) };
      }
      function fld(key, name, label, L, ph, mode) { return `<label class="f">${label}<input id="${key}-${name}" data-k="${key}" data-f="${name}" inputmode="${mode || "numeric"}" value="${esc(L[name])}" placeholder="${ph || ""}"></label>` }
      function logForm(key, it, L) {
        const n = num(it.rounds) || 0;
        let h = `<label class="toggle"><input type="checkbox" id="${key}-done" data-k="${key}" data-f="done" ${L.done ? "checked" : ""}> Session done</label>`;
        if (it.type === "bike") { const cap = num(S.bikeCap); h += `<div class="hint">Target ${it.mins || "?"} min at RPE 3–4.${cap ? ` Keep heart rate under <b>${cap}</b> bpm.` : " Set your Zone 2 ceiling in the Watch tab to get an HR target."}</div>` }
        if (it.type === "row") h += `<div class="hint">${n} × 5:00 work, 1:00 rest. At the end of each round note the Watch HR, then again at the end of the rest minute.</div>`;
        if (it.type === "sim") h += `<div class="hint">${n} × 5:00 rounds, 1:00 rest. Rate each round's effort straight after the buzzer (1–10). The goal is a flat line: round ${n || 5} should not feel much harder than round 1.</div>`;
        if (TYPES[it.type].mat) h += `<div class="fields">${fld(key, "dur", "Minutes", L, "")}${fld(key, "rpe", "Session RPE", L, "1–10", "decimal")}${it.type === "sim" ? "" : fld(key, "rolls", "Hard rounds", L, "e.g. 6")}</div>`;
        else if (TYPES[it.type].hr) h += `<div class="fields">${fld(key, "dur", "Minutes", L, it.mins || "")}${fld(key, "avg", "Avg HR", L, "bpm")}${fld(key, "max", "Max HR", L, "bpm")}${fld(key, "rpe", "RPE", L, "1–10", "decimal")}</div>`;
        else h += `<div class="fields">${fld(key, "dur", "Minutes", L, "")}</div>`;
        if (hasRounds(it) && n > 0) {
          const R = L.rounds || [];
          if (it.type === "sim") {
            h += `<div class="rounds"><table><thead><tr><th>Rd</th><th>Effort RPE</th><th>Gas in last minute</th></tr></thead><tbody>`;
            for (let r = 0; r < n; r++) {
              const x = R[r] || {};
              h += `<tr><td>${r + 1}</td><td><input id="${key}-r${r}-rpe" data-k="${key}" data-r="${r}" data-rf="rpe" inputmode="decimal" value="${esc(x.rpe)}" placeholder="1–10"></td><td><select id="${key}-r${r}-gas" data-k="${key}" data-r="${r}" data-rf="gas">${["", "Attacking", "Holding on", "Survival"].map(g => `<option value="${g}"${(x.gas || "") === g ? " selected" : ""}>${g || "–"}</option>`).join("")}</select></td></tr>`
            }
            h += `</tbody></table></div><div class="derived" id="${key}-derived">${derived(it, L)}</div>`;
          } else {
            h += `<div class="rounds"><table><thead><tr><th>Rd</th><th>HR end</th><th>HR after rest</th>${it.type === "row" ? "<th>Metres</th>" : ""}</tr></thead><tbody>`;
            for (let r = 0; r < n; r++) {
              const x = R[r] || {};
              h += `<tr><td>${r + 1}</td><td><input id="${key}-r${r}-end" data-k="${key}" data-r="${r}" data-rf="end" inputmode="numeric" value="${esc(x.end)}" placeholder="bpm"></td><td><input id="${key}-r${r}-rec" data-k="${key}" data-r="${r}" data-rf="rec" inputmode="numeric" value="${esc(x.rec)}" placeholder="bpm"></td>${it.type === "row" ? `<td><input id="${key}-r${r}-m" data-k="${key}" data-r="${r}" data-rf="m" inputmode="numeric" value="${esc(x.m)}" placeholder="m"></td>` : ""}</tr>`
            }
            h += `</tbody></table></div><div class="derived" id="${key}-derived">${derived(it, L)}</div>`;
          }
        }
        h += `<label class="f">Notes<textarea id="${key}-notes" data-k="${key}" data-f="notes" placeholder="How did it feel? Partners, gas, technique.">${esc(L.notes)}</textarea></label>`;
        if (hasRounds(it) || it.type === "bike") h += `<div class="row"><a class="btn" href="#timer" data-timer="${it.type}|${it.type === "bike" ? (it.mins || 30) : n}">Open ${it.type === "bike" ? "bike" : "round"} timer</a></div>`;
        return h;
      }
      function derived(it, L) {

        (D.items || []).forEach((x, i) => { const v = per(x, num(x.g) || 0); const s = (id, val) => { const el = document.getElementById(id); if (el) el.textContent = val }; s("dk-" + i, n0(v.k)); s("dp-" + i, r1(v.p)); s("dc-" + i, r1(v.c)); s("df-" + i, r1(v.f)) });
        const s = (id, val) => { const el = document.getElementById(id); if (el) el.textContent = val };
        s("dt-k", n0(T.t.k)); s("dt-p", r1(T.t.p)); s("dt-c", r1(T.t.c)); s("dt-f", r1(T.t.f));
        const a = document.getElementById("fb-ate"); if (a) a.innerHTML = ateLine(T);
      }
      function emptyDraft() { return { name: "", items: [], serv: 1, eat: 1 } }

      /* ---------- render + routing ---------- */
      function tab() { const h = location.hash.slice(1); return ["week", "timer", "fuel", "progress", "watch"].includes(h) ? h : "week" }
      function render() {
        const t = tab(), v = document.getElementById("view");
        document.querySelectorAll(".tabs a").forEach(a => a.classList.toggle("on", a.dataset.tab === t));
        v.innerHTML = `<div style="display:flex;flex-direction:column;gap:16px">${t === "week" ? renderWeek() : t === "timer" ? renderTimer() : t === "progress" ? renderProgress() : t === "fuel" ? renderFuel() : renderWatch()}</div>`;
        if (t === "timer") paintTimer();
      }
      window.addEventListener("hashchange", () => { render(); window.scrollTo(0, 0) });

      function findItem(ref) { const [w, i, id] = ref.split("|"); const list = editItems(+w, +i); return { w: +w, i: +i, list, it: list.find(x => x.id === id) } }

      document.addEventListener("click", e => {
        const b = e.target.closest("[data-week]"); if (b) { selWeek = +b.dataset.week; openKey = null; resetTimer(T.kind, null); render(); return }
        const dd = e.target.closest("[data-doneday]"); if (dd) {
          e.preventDefault(); e.stopPropagation(); const [w, i] = dd.dataset.doneday.split("|").map(Number); const list = items(w, i);
          const all = list.length && list.every(it => (S.logs[logKey(w, i, it)] || {}).done);
          list.forEach(it => { const k = logKey(w, i, it); const L = S.logs[k] = S.logs[k] || {}; L.done = !all }); scheduleSave(); render(); return
        }
        const o = e.target.closest("[data-open]"); if (o) { openKey = openKey === o.dataset.open ? null : o.dataset.open; render(); return }
        const s = e.target.closest("[data-sat]"); if (s) {
          const w = selWeek; S.sat[w] = s.dataset.sat;
          const k = dk(w, 5); if (S.custom[k]) { const p = S.custom[k].find(x => x.id === "p"); if (p) { const keep = { id: "p", when: p.when }; Object.keys(p).forEach(x => delete p[x]); Object.assign(p, keep, defaults(s.dataset.sat, w, 5)) } }
          scheduleSave(); render(); return
        }
        const ad = e.target.closest("[data-add]"); if (ad) {
          const [w, i] = ad.dataset.add.split("|").map(Number); const type = document.getElementById("add-" + dk(w, i)).value, when = document.getElementById("addw-" + dk(w, i)).value;
          const it = Object.assign({ id: "x" + Date.now().toString(36) }, defaults(type, w, i)); if (when) it.when = when; editItems(w, i).push(it); scheduleSave(); render(); return
        }
        const rm = e.target.closest("[data-remove]"); if (rm) { const f = findItem(rm.dataset.remove); const ix = f.list.indexOf(f.it); if (ix > -1) f.list.splice(ix, 1); scheduleSave(); render(); return }
        const rs = e.target.closest("[data-resetday]"); if (rs) { const [w, i] = rs.dataset.resetday.split("|").map(Number); delete S.custom[dk(w, i)]; scheduleSave(); render(); return }
        const tk = e.target.closest("[data-tk]"); if (tk) { resetTimer(tk.dataset.tk, null); render(); return }
        const tl = e.target.closest("[data-timer]"); if (tl) { const [k, n] = tl.dataset.timer.split("|"); resetTimer(k, num(n)); return }
        const fm = e.target.closest("[data-fmode]"); if (fm) { foodMode = fm.dataset.fmode; render(); return }
        const pk = e.target.closest("[data-pick]"); if (pk) { pick = (window.__matches || [])[+pk.dataset.pick] || null; const q = document.getElementById("fb-q"); if (q && pick) q.value = pick.name; document.getElementById("fb-res").innerHTML = ""; const g = document.getElementById("fb-g"); if (g) g.focus(); return }
        if (e.target.id === "fb-addi") {
          const q = document.getElementById("fb-q").value.trim(), g = num(document.getElementById("fb-g").value);
          if (!pick || pick.name !== q) pick = allIngredients().find(x => x.name.toLowerCase() === q.toLowerCase()) || null;
          if (!pick) { showMatches(q); return }
          if (!g || g <= 0) { document.getElementById("fb-g").focus(); return }
          F().draft.items.push({ name: pick.name, kcal: pick.kcal, p: pick.p, c: pick.c, f: pick.f, g }); pick = null; scheduleSave(); render(); setTimeout(() => { const q = document.getElementById("fb-q"); if (q) q.focus() }, 0); return
        }
        const drm = e.target.closest("[data-drm]"); if (drm) { F().draft.items.splice(+drm.dataset.drm, 1); scheduleSave(); render(); return }
        if (e.target.id === "fb-clear") { F().draft = emptyDraft(); pick = null; scheduleSave(); render(); return }
        if (e.target.id === "fb-log") {
          const D = F().draft, T = draftTotals(); if (!D.items.length) return;
          const ing = D.items.map(x => x.name.split(",")[0] + " " + x.g + "g").join(", ") + (T.ratio !== 1 ? ` · ${num(D.eat) || 1} of ${num(D.serv) || 1} portions` : "");
          addFood({ name: D.name || "Meal", kcal: Math.round(T.e.k), p: r1(T.e.p), c: r1(T.e.c), f: r1(T.e.f), ing });
          F().draft = emptyDraft(); scheduleSave(); render(); return
        }
        if (e.target.id === "fb-save") {
          const D = F().draft; if (!D.items.length) return; const name = (D.name || "").trim(); if (!name) { document.getElementById("fb-msg").textContent = "Give the meal a name first."; document.getElementById("fb-name").focus(); return }
          const ex = Object.entries(F().meals).find(([, m]) => m.name.toLowerCase() === name.toLowerCase()); const id = ex ? ex[0] : "m" + Date.now().toString(36);
          F().meals[id] = JSON.parse(JSON.stringify({ name, items: D.items, serv: D.serv || 1 })); scheduleSave(); document.getElementById("fb-msg").textContent = ex ? "Saved meal updated." : "Saved."; return
        }
        const ml = e.target.closest("[data-meal]"); if (ml) { const m = F().meals[ml.dataset.meal]; if (m) { F().draft = JSON.parse(JSON.stringify({ name: m.name, items: m.items, serv: m.serv || 1, eat: 1 })); scheduleSave(); render() } return }
        const dm = e.target.closest("[data-delmeal]"); if (dm) { delete F().meals[dm.dataset.delmeal]; scheduleSave(); render(); return }
        const di = e.target.closest("[data-deling]"); if (di) { delete F().ingr[di.dataset.deling]; scheduleSave(); render(); return }
        if (e.target.id === "ni-save") {
          const g = id => document.getElementById(id).value.trim(); const name = g("ni-name"), p = num(g("ni-p")) || 0, c = num(g("ni-c")) || 0, fa = num(g("ni-f")) || 0; let k = num(g("ni-kcal"));
          if (!name) { document.getElementById("ni-msg").textContent = "Give it a name."; return }
          if (k == null) k = Math.round(p * 4 + c * 4 + fa * 9);
          F().ingr["i" + Date.now().toString(36)] = { name, kcal: k, p, c, f: fa }; scheduleSave(); render();
          setTimeout(() => { const d = document.querySelector(".newing"); if (d) d.open = true; const q = document.getElementById("fb-q"); if (q) { q.value = name; showMatches(name) } }, 0); return
        }
        const fd = e.target.closest("[data-fday]"); if (fd) { fuelDate = iso(addDays(parse(fuelDate), +fd.dataset.fday)); render(); return }
        if (e.target.id === "ff-add") {
          const g = id => document.getElementById(id).value.trim(); const name = g("ff-name"), p = num(g("ff-p")), c = num(g("ff-c")), fa = num(g("ff-f")); let k = num(g("ff-kcal"));
          if (k == null && (p != null || c != null || fa != null)) k = Math.round((p || 0) * 4 + (c || 0) * 4 + (fa || 0) * 9);
          if (!name && k == null) { document.getElementById("ff-msg").textContent = "Add a name or some calories first."; return }
          addFood({ name: name || "Food", kcal: k || 0, p, c, f: fa }); return
        }
        const ra = e.target.closest("[data-readd]"); if (ra) { const x = (window.__recent || [])[+ra.dataset.readd]; if (x) addFood({ name: x.name, kcal: x.kcal, p: x.p, c: x.c, f: x.f, ing: x.ing }); return }
        const df = e.target.closest("[data-delfood]"); if (df) { const L = F().food[fuelDate] || []; const ix = L.findIndex(x => x.id === df.dataset.delfood); if (ix > -1) L.splice(ix, 1); scheduleSave(); render(); return }
        if (e.target.id === "tgo") { T.running ? pauseTimer() : startTimer(); return }
        if (e.target.id === "treset") { resetTimer(); paintTimer(); return }
        if (e.target.id === "tskip") { if (T.phases[T.idx].t !== "done") { T.idx++; T.left = T.phases[T.idx].dur; if (T.phases[T.idx].t === "done") { pauseTimer() } paintTimer() } return }
        if (e.target.id === "signout") { fetch("/api/logout", { method: "POST" }).finally(() => { try { localStorage.removeItem("fre-state") } catch (err) { } if (window.caches) caches.keys().then(ks => Promise.all(ks.map(k => caches.delete(k)))).finally(() => location.replace("/login.html")); else location.replace("/login.html") }); return }
        if (e.target.id === "bk-copy") {
          const txt = JSON.stringify(S), ta = document.getElementById("bk-text"), msg = document.getElementById("bk-msg");
          const fb = () => { ta.value = txt; ta.focus(); ta.select(); msg.textContent = "Select all and copy." };
          try { navigator.clipboard.writeText(txt).then(() => { msg.textContent = "Copied. Paste it somewhere safe." }, fb) } catch (err) { fb() } return
        }
        if (e.target.id === "bk-restore") {
          const msg = document.getElementById("bk-msg"); let o; try { o = JSON.parse(document.getElementById("bk-text").value) } catch (err) { msg.textContent = "That isn't a valid backup."; return }
          if (!o || typeof o !== "object" || !o.start || !o.logs) { msg.textContent = "That isn't a valid backup."; return }
          if (!document.getElementById("bk-restore").dataset.armed) { document.getElementById("bk-restore").dataset.armed = "1"; document.getElementById("bk-restore").textContent = "Tap again to replace all current data"; return }
          hydrate(o); S._t = Date.now(); scheduleSave(); render(); return
        }
        if (e.target.id === "copy") {
          const txt = progressText(), ta = document.getElementById("copytext"), msg = document.getElementById("copied");
          const fallback = () => { ta.hidden = false; ta.value = txt; ta.style.minHeight = "160px"; ta.focus(); ta.select(); msg.textContent = "Select all and copy." };
          try { navigator.clipboard.writeText(txt).then(() => { msg.textContent = "Copied." }, fallback) } catch (err) { fallback() }
        }
      });
      document.addEventListener("input", e => {
        const el = e.target;
        if (el.dataset.ready) { const k = iso(new Date()); S.ready[k] = S.ready[k] || {}; S.ready[k][el.dataset.ready] = el.value; scheduleSave(); document.getElementById("rdflag").innerHTML = flagHtml(readiness(k)); return }
        if (el.id === "bikecap") { S.bikeCap = el.value; scheduleSave(); return }
        if (el.id === "fb-q") { if (pick && pick.name !== el.value) pick = null; showMatches(el.value); return }
        if (el.id === "fb-name") { F().draft.name = el.value; scheduleSave(); return }
        if (el.id === "fb-serv" || el.id === "fb-eat") { F().draft[el.id === "fb-serv" ? "serv" : "eat"] = el.value; scheduleSave(); refreshDraftNumbers(); return }
        if (el.dataset.dg !== undefined) { const x = F().draft.items[+el.dataset.dg]; if (x) { x.g = num(el.value) || 0; scheduleSave(); refreshDraftNumbers() } return }
        if (el.id === "fw") { if (el.value.trim()) F().weights[fuelDate] = el.value.trim(); else delete F().weights[fuelDate]; scheduleSave(); return }
        if (el.dataset.fuel && el.tagName === "INPUT" && el.type !== "checkbox") { F()[el.dataset.fuel] = el.value; scheduleSave(); return }
        if (el.id === "startdate") { if (el.value) { S.start = iso(mondayOf(parse(el.value))); scheduleSave() } return }
        if (el.dataset.param && el.dataset.pf === "title") { findItem(el.dataset.param).it.title = el.value; scheduleSave(); return }
        const k = el.dataset.k; if (!k) return;
        const L = S.logs[k] = S.logs[k] || {};
        if (el.dataset.rf) {
          L.rounds = L.rounds || []; const r = +el.dataset.r; L.rounds[r] = L.rounds[r] || {}; L.rounds[r][el.dataset.rf] = el.value;
          const d = document.getElementById(k + "-derived"); if (d && itemByKey[k]) d.innerHTML = derived(itemByKey[k], L)
        }
        else if (el.dataset.f === "done") return;
        else L[el.dataset.f] = el.value;
        scheduleSave();
      });
      document.addEventListener("change", e => {
        const el = e.target;
        if (el.tagName === "SELECT" && el.dataset.rf) { const L = S.logs[el.dataset.k] = S.logs[el.dataset.k] || {}; L.rounds = L.rounds || []; const r = +el.dataset.r; L.rounds[r] = L.rounds[r] || {}; L.rounds[r][el.dataset.rf] = el.value; const d = document.getElementById(el.dataset.k + "-derived"); if (d && itemByKey[el.dataset.k]) d.innerHTML = derived(itemByKey[el.dataset.k], L); scheduleSave(); return }
        if (el.dataset.fuel) { const k = el.dataset.fuel; F()[k] = el.type === "checkbox" ? el.checked : el.tagName === "SELECT" && k !== "sex" ? num(el.value) : el.value; scheduleSave(); render(); return }
        if (el.id === "fw") { render(); return }
        if (el.type === "checkbox" && el.dataset.f === "done" && el.dataset.k) { const L = S.logs[el.dataset.k] = S.logs[el.dataset.k] || {}; L.done = el.checked; scheduleSave(); render(); return }
        if (el.id === "wkdone") { S.weeks[selWeek] = el.checked; scheduleSave(); render(); return }
        if (el.id === "startdate") { selWeek = Math.min(8, Math.max(1, weekOfDate(new Date()))); render(); return }
        if (el.dataset.swap) { const f = findItem(el.dataset.swap); const keep = { id: f.it.id, when: f.it.when }; Object.keys(f.it).forEach(x => delete f.it[x]); Object.assign(f.it, keep, defaults(el.value, f.w, f.i)); if (!f.it.when) delete f.it.when; scheduleSave(); render(); return }
        if (el.dataset.when !== undefined && el.dataset.when) { const f = findItem(el.dataset.when); if (el.value) f.it.when = el.value; else delete f.it.when; scheduleSave(); render(); return }
        if (el.dataset.param && el.dataset.pf !== "title") { const f = findItem(el.dataset.param); const v = num(el.value); if (v != null && v > 0) f.it[el.dataset.pf] = Math.round(v); scheduleSave(); render(); return }
      });
      document.addEventListener("keydown", e => { if (e.key === "Enter" && (e.target.id === "fb-g" || e.target.id === "fb-q")) { e.preventDefault(); const b = document.getElementById("fb-addi"); if (b) b.click() } });
      document.addEventListener("visibilitychange", async () => { if (document.visibilityState === "visible" && T.running) { try { if (navigator.wakeLock) T.lock = await navigator.wakeLock.request("screen") } catch (e) { } } });
      resetTimer("row", null);
      initStore();
    })();
  </script>
